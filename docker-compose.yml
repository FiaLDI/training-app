services:
  postgres:
    image: postgres:17-alpine
    container_name: workout-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Local:  docker compose up --build  → tags workout-*:${IMAGE_TAG:-local}
  # Prod:   docker compose up --no-build with IMAGE_TAG from .env (pre-loaded images)
  backend:
    image: workout-backend:${IMAGE_TAG:-local}
    build:
      context: ./backend
    container_name: workout-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 3000
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
    expose:
      - "3000"

  frontend:
    image: workout-frontend:${IMAGE_TAG:-local}
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: /api
    container_name: workout-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      PORT: 3001
      HOSTNAME: 0.0.0.0
    expose:
      - "3001"

  upload:
    image: workout-upload:${IMAGE_TAG:-local}
    build:
      context: ./upload-service
    container_name: workout-upload
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      UPLOAD_PORT: 3002
      PORT: 3002
      UPLOAD_DIR: /data/upload
      UPLOAD_PUBLIC_PATH: /upload
      BACKEND_URL: http://backend:3000
      UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-5242880}
      UPLOAD_MAX_FILES: ${UPLOAD_MAX_FILES:-100}
    volumes:
      - ./upload:/data/upload
    expose:
      - "3002"

  nginx:
    image: nginx:1.27-alpine
    container_name: workout-nginx
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
      - upload
    ports:
      - "${APP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro

  certbot:
    image: certbot/certbot:latest
    container_name: workout-certbot
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    profiles:
      - ssl

volumes:
  postgres-data:
